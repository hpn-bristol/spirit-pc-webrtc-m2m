[workspace]
name      = "mdc_encoder"
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64"]
preview   = ["pixi-build"]
channels  = [
  "https://prefix.dev/pixi-build-backends",
  "https://prefix.dev/conda-forge",
]

[package]
name    = "mdc_encoder"
version = "0.1.0"

[package.build]
backend.name    = "pixi-build-cmake"
backend.version = "*"

[package.build.config]
extra-args = [
  "-DCMAKE_BUILD_TYPE=Release",
  "-DBUILD_SHARED_LIBS=ON",
  "-DBUILD_TESTING=ON",    # <-- will always run the tests as well
  "-DCMAKE_INSTALL_LIBDIR=lib",
]

# Build tools used by the generator (pkg-config preferred discovery path)
[package.build-dependencies]
pkg-config = "*"

# Libraries we compile against (headers+libs)
[package.host-dependencies]
draco = "*"

# Shared Draco at runtime (drop if you later switch to static linking)
[package.run-dependencies]
draco = "*"

[feature.test.dependencies]
cmake      = "*"
ninja      = "*"
pkg-config = "*"
cppcheck   = "*"
draco      = "*"

[environments]
test = ["test"]

# -- Does not work very well when we have pixi dependencies --
# -- just rely on `pixi build` instead.
# [tasks.cmake]
# cmd = """
# cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && \
# cmake --build build --config Release
# """
# default-environment = "test"

[tasks.check]
args = [{ arg = "target", default = "." }]
cmd = """
cppcheck --std=c++17 --language=c++ \
  --enable=warning,performance,portability \
  -i .pixi -i build -i dist \
  --inline-suppr --error-exitcode=2 --quiet {{ target }}
"""
default-environment = "test"

# -- Does not work very well when we have pixi dependencies --
# -- just create a new target that always run on cmake,
# -- so that it is automatically called when running `pixi build`
# [tasks.test]
# cmd = "ctest --test-dir build --output-on-failure"
# depends-on = ["cmake"]
# default-environment = "test"

[tasks.clean]
cmd = "rm -rf .pixi/build && cmake -E rm -rf build dist _prefix"
default-environment = "test"
