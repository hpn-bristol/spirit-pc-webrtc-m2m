[workspace]
name      = "webrtc-connector"
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64"]
preview   = ["pixi-build"]
channels  = [
  "https://prefix.dev/pixi-build-backends",
  "https://prefix.dev/conda-forge",
]

[package]
name    = "webrtc-connector"
version = "0.1.0"

[package.build]
backend.name    = "pixi-build-cmake"
backend.version = "*"

[package.build-dependencies]
# Build-time only; not a runtime/package dependency.
python = ">=3.9"

[feature.test.dependencies]  # Dependencies are defined by features
python   = ">=3.9"
cmake    = "*"
ninja    = "*"
cppcheck = "*"

[environments]  # Environments have many features
test = ["test"]

[tasks.cmake]
cmd = """
cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && \
cmake --build build --config Release
"""
default-environment = "test"

[tasks.check]
args = [{ arg = "target", default = "." }]
cmd = """
cppcheck --std=c++20 --language=c++ \
  --enable=warning,performance,portability \
  -i .pixi -i build -i dist \
  --inline-suppr --error-exitcode=2 --quiet {{ target }}
"""
default-environment = "test"

# `test` depends on `make` and runs the header self-containment + any CTest tests
[tasks.test]
cmd = "ctest --test-dir build --output-on-failure"
depends-on = ["cmake"]
default-environment = "test"

# Full clean: remove the whole build directory (CMake cache, files, temp)
[tasks.clean]
cmd = "cmake -E rm -rf build"
default-environment = "test"

# Clean build artifacts produced by the generator (keeps CMake cache)
[tasks.lightclean]
cmd = "cmake --build build --target clean || true"
default-environment = "test"
