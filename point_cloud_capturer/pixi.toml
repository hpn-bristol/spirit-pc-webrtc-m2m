[workspace]
name      = "point_cloud_capturer"
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64"]
preview   = ["pixi-build"]
channels  = [
  "https://prefix.dev/pixi-build-backends",
  "https://prefix.dev/conda-forge",
]

[package]
name    = "point_cloud_capturer"
version = "0.1.0"

[package.build]
backend.name    = "pixi-build-cmake"
backend.version = "*"

[package.build.config]
extra-args = [
  "-DCMAKE_BUILD_TYPE=Release",
  "-DBUILD_SHARED_LIBS=ON",
  "-DCMAKE_INSTALL_LIBDIR=lib",
  # Respect our conditional toggles; OFF by default unless SDKs are found.
  "-DENABLE_K4A=AUTO",
]

# Build helpers
[package.build-dependencies]
pkg-config = "*"

# Libraries we compile against (headers + libs)
[package.host-dependencies]
librealsense = "*"   # provides realsense2 headers + libs
fast_float   = "*"   # header-only, used by PLY writer/reader utils if included

[package.run-dependencies]
librealsense = "*"

[feature.test.dependencies]
cmake        = "*"
ninja        = "*"
pkg-config   = "*"
cppcheck     = "*"
librealsense = "*"

[environments]
test = ["test"]

[tasks.check]
args = [{ arg = "target", default = "." }]
cmd = """
cppcheck --std=c++20 --language=c++ \
  --enable=warning,performance,portability \
  -i .pixi -i build -i dist \
  --inline-suppr --error-exitcode=2 --quiet {{ target }}
"""
default-environment = "test"

[tasks.clean]
cmd = "rm -rf .pixi/build && cmake -E rm -rf build dist _prefix"
default-environment = "test"
